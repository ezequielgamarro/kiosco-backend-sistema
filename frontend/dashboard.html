<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terminal POS | Punto de Venta</title>
  <link href="./dist/css/app.css" rel="stylesheet" type="text/css">
</head>
<body class="flex">

  <!-- ============================ SIDEBAR ============================ -->
  <aside id="sidebar" class="fixed z-40 inset-y-0 left-0 w-64 bg-pos-bg border-r border-pos-secondary/60 transition-transform duration-300 -translate-x-full lg:translate-x-0 lg:static" aria-label="Navegación principal">
    <div class="flex flex-col h-full">
      <a href="pos.html" class="flex items-center gap-3 px-5 h-16 border-b border-pos-secondary/60">
        <img src="/assets/isotipo.svg" alt="Isotipo POS" class="h-8 w-8">
        <span class="text-lg font-bold text-pos-text-head">Punto de Venta</span>
      </a>
      <nav class="flex-1 overflow-y-auto p-4 space-y-1">
        <p class="px-3 text-xs font-semibold text-pos-text-body/60 uppercase tracking-wider mb-2">Principal</p>
        <a href="dashboard.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-pos-text-body hover:bg-pos-secondary/40 transition-colors"><span>Dashboard / Reportes</span></a>
        <a href="pos.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium bg-pos-secondary/60 text-pos-text-head"><span>Terminal POS</span></a>
        <a href="inventario.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-pos-text-body hover:bg-pos-secondary/40 transition-colors"><span>Inventario</span></a>
        <a href="caja.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-pos-text-body hover:bg-pos-secondary/40 transition-colors"><span>Caja / Arqueo</span></a>
        <p class="px-3 text-xs font-semibold text-pos-text-body/60 uppercase tracking-wider mt-6 mb-2">Sesión</p>
        <a href="login.html" id="logout-btn" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-pos-danger hover:bg-pos-danger/10 transition-colors"><span>Cerrar sesión</span></a>
      </nav>
    </div>
  </aside>
  <div id="sidebar-overlay" class="fixed inset-0 z-30 bg-pos-stroke/50 backdrop-blur-sm lg:hidden hidden"></div>

  <!-- ===================== CONTENIDO PRINCIPAL ===================== -->
  <div class="flex flex-col flex-1 min-w-0">

    <!-- Header -->
    <header class="sticky top-0 z-20 flex items-center gap-4 px-4 sm:px-6 h-16 bg-pos-bg border-b border-pos-secondary/60">
      <button id="menu-toggle" class="p-2 -ml-2 rounded-lg text-pos-text-head hover:bg-pos-secondary/40 lg:hidden" type="button" aria-label="Abrir menú">
        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <h4 class="text-lg font-semibold text-pos-text-head">Terminal POS</h4>
      <button class="ml-auto flex items-center gap-2 p-1.5 rounded-lg hover:bg-pos-secondary/40" type="button">
        <span class="flex items-center justify-center h-8 w-8 rounded-full bg-pos-primary text-pos-primary-text text-sm font-semibold" id="profile-initial">U</span>
        <span class="hidden sm:block text-sm font-medium text-pos-text-body" id="profile-name">Usuario</span>
        <span id="profile-rol"></span>
      </button>
    </header>

    <!-- Contenido POS: flex-col en móvil, md:flex-row en escritorio -->
    <main class="flex-1 flex flex-col md:flex-row p-4 sm:p-6 gap-4 sm:gap-6 min-h-[calc(100vh-4rem)]">

      <!-- ======== PANEL IZQUIERDO: CATÁLOGO ======== -->
      <div class="flex-1 flex flex-col min-w-0">
        <!-- Barra de búsqueda -->
        <div class="pos-card p-4 mb-4">
          <div class="relative">
            <span class="absolute inset-y-0 left-3 flex items-center text-pos-text-body/60">
              <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            </span>
            <input id="pos-search" type="text" class="form-input-pos pl-10" placeholder="Buscar por nombre o código de barras...">
          </div>
        </div>

        <!-- Grid de catálogo, con scroll interno -->
        <div class="flex-1 overflow-y-auto pr-1">
          <div id="pos-catalogo" class="grid grid-cols-2 sm:grid-cols-3 xl:grid-cols-4 gap-4">
            <!-- Tarjetas de producto generadas por JS -->
          </div>
        </div>
      </div>

      <!-- ======== PANEL DERECHO: CARRITO / COBRO ======== -->
      <div class="w-full md:w-96 lg:w-[26rem] flex flex-col min-w-0">
        <div class="pos-card flex flex-col h-full overflow-hidden">

          <!-- Lista del carrito (scroll) -->
          <div class="flex-1 overflow-y-auto p-4 space-y-3 min-h-[12rem]" id="carrito-items">
            <p class="text-center text-pos-text-body/60 text-sm py-8">El carrito está vacío</p>
          </div>

          <!-- Resumen y cobro -->
          <div class="border-t border-pos-secondary/40 p-4 space-y-3">
            <div class="flex justify-between text-sm">
              <span class="text-pos-text-body/70">Subtotal</span>
              <span class="font-semibold text-pos-text-head" id="carrito-subtotal">$0.00</span>
            </div>
            <div class="flex justify-between text-sm">
              <span class="text-pos-text-body/70">Descuentos</span>
              <span class="font-semibold text-pos-danger" id="carrito-descuentos">-$0.00</span>
            </div>
            <div class="flex justify-between text-base font-bold">
              <span class="text-pos-text-head">Total</span>
              <span class="text-pos-primary" id="carrito-total">$0.00</span>
            </div>

            <!-- Método de pago -->
            <select id="metodo-pago" class="form-input-pos">
              <option value="efectivo">Efectivo</option>
              <option value="tarjeta">Tarjeta</option>
              <option value="transferencia">Transferencia</option>
              <option value="mixto">Mixto</option>
            </select>

            <!-- Cliente -->
            <input id="cliente-venta" type="text" class="form-input-pos" placeholder="Cliente (opcional)">

            <!-- Botón cobrar -->
            <button id="btn-cobrar" class="btn-primary w-full !py-3">Cobrar venta</button>
          </div>
        </div>
      </div>

    </main>
  </div>

  <!-- JS del layout (solo menú responsive; seguridad/iniciar perfil los maneja guard.js) -->
  <script>
    (function () {
      const menu = document.getElementById('menu-toggle');
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebar-overlay');
      function closeS() { sidebar?.classList.add('-translate-x-full'); overlay?.classList.add('hidden'); }
      function openS() { sidebar?.classList.remove('-translate-x-full'); overlay?.classList.remove('hidden'); }
      menu?.addEventListener('click', () => sidebar?.classList.contains('-translate-x-full') ? openS() : closeS());
      overlay?.addEventListener('click', closeS);
    })();
  </script>

  <!-- Seguridad: backend local JWT (sin Supabase) -->
  <script src="./services/config.js"></script>
  <script src="./services/guard.js"></script>

  <!-- JS del Terminal POS -->
  <script type="module" src="./services/pos.js"></script>
</body>
</html>
