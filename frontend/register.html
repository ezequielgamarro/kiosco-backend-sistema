<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión | Punto de Venta</title>
  <!-- CSS compilado de Tailwind con la paleta pos-* -->
  <link href="./dist/css/app.css" rel="stylesheet" type="text/css">
</head>
<body class="bg-pos-primary h-screen w-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md">

    <!-- Tarjeta de inicio de sesión: fondo pos-bg + sombra pos-card -->
    <div class="bg-pos-bg shadow-pos-card rounded-2xl border border-pos-secondary/40">
      <div class="px-6 py-8">

        <!-- Logo del cliente -->
        <div class="flex justify-center mb-6">
          <a href="login.html">
            <img class="h-12 w-12 rounded-lg" src="/assets/isotipo.svg" alt="Isotipo POS">
          </a>
        </div>

        <h2 class="text-2xl font-bold text-pos-text-head text-center mb-1">Bienvenido de nuevo</h2>
        <p class="text-center text-sm text-pos-text-body/70 mb-8">Inicia sesión para continuar al Punto de Venta</p>

        <!-- Formulario tradicional: Email + Contraseña + botón -->
        <form id="login-form" class="space-y-4" novalidate>
          <div>
            <label class="form-label" for="login-email">Correo electrónico</label>
            <input id="login-email" type="email" class="form-input-pos" placeholder="usuario@correo.com" autocomplete="email" required>
          </div>

          <div>
            <div class="flex items-center justify-between mb-1.5">
              <label class="form-label mb-0" for="login-password">Contraseña</label>
              <a href="#" class="text-sm text-pos-primary hover:underline">¿Olvidaste tu contraseña?</a>
            </div>
            <input id="login-password" type="password" class="form-input-pos" placeholder="••••••••" autocomplete="current-password" required>
          </div>

          <p id="login-error" class="hidden text-sm text-pos-danger font-medium"></p>

          <!-- Botón principal -->
          <button type="submit" class="btn-primary w-full !py-3">Iniciar Sesión</button>
        </form>

        <!-- Separador: "O continuar con" -->
        <div class="flex items-center gap-3 my-6">
          <hr class="flex-1 border-pos-secondary">
          <span class="text-xs text-pos-text-body/60 uppercase tracking-wider">O continuar con</span>
          <hr class="flex-1 border-pos-secondary">
        </div>

        <!-- Botón de Google (estilo contorno) -->
        <button type="button" onclick="loginGoogle()"
                class="w-full flex items-center justify-center gap-3 px-4 py-2.5 rounded-lg
                       border border-pos-stroke text-pos-text-head bg-transparent
                       hover:bg-pos-secondary/30 transition-colors duration-200 font-medium">
          <svg class="h-5 w-5" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          <span>Continuar con Google</span>
        </button>

      </div>
    </div>

    <!-- Link inferior -->
    <p class="text-pos-primary-text text-center mt-6 text-sm">
      ¿No tienes cuenta? <a href="register.html" class="font-semibold hover:underline">Regístrate</a>
    </p>
  </div>

  <!-- Configuración de la API local -->
  <script src="./services/config.js"></script>
  <!-- Lógica de autenticación (FastAPI local/JWT) -->
  <script src="./services/auth.js"></script>
</body>
</html>
